# Builds the three installers with the packaging scripts and, on a v* tag,
# puts them in a draft release with their SHA-256 sums. Write the notes and
# publish it by hand: the in-app updater reads releases/latest.
#
# A pull request that touches packaging builds them unsigned, as a check.
#
# Repository variables: PAKON_RYBBIT_URL, PAKON_RYBBIT_SITE_ID,
# PAKON_RYBBIT_DOMAIN (opt-in reports; left out, the builds never send any).
# Secrets, macOS: MACOS_CERT_P12 (base64 Developer ID Application .p12),
# MACOS_CERT_PASSWORD, and to notarize either APPLE_API_KEY (base64 .p8),
# APPLE_API_KEY_ID, APPLE_API_ISSUER or APPLE_ID, APPLE_TEAM_ID,
# APPLE_APP_PASSWORD (app-specific). A tag build fails without both.
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PAKON_RYBBIT_URL: ${{ vars.PAKON_RYBBIT_URL }}
  PAKON_RYBBIT_SITE_ID: ${{ vars.PAKON_RYBBIT_SITE_ID }}
  PAKON_RYBBIT_DOMAIN: ${{ vars.PAKON_RYBBIT_DOMAIN }}
  RUST: 1.99.0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V=0.0.0; fi
          [[ "$V" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "bad tag: $GITHUB_REF" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tools
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          python3 -m venv .venv && .venv/bin/pip install --quiet pillow

      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "a release needs MACOS_CERT_P12 and MACOS_CERT_PASSWORD" >&2; exit 1
            fi
            echo "no certificate: signing ad hoc"; exit 0
          fi
          KC="$RUNNER_TEMP/pakon.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          [ -n "$P12_PASSWORD" ] || { echo "MACOS_CERT_PASSWORD is not set" >&2; exit 1; }
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:P12_PASSWORD -nokeys 2>/dev/null \
              | grep -q 'Developer ID Application' \
            || { echo "MACOS_CERT_P12 is not a .p12 with the Developer ID Application certificate" \
                   "($(wc -c < "$RUNNER_TEMP/cert.p12") bytes decoded), or the password is wrong" >&2; exit 1; }
          security import "$RUNNER_TEMP/cert.p12" -f pkcs12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          if [ -n "$API_KEY" ]; then
            echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
            xcrun notarytool store-credentials pakon-ci --key "$RUNNER_TEMP/key.p8" \
              --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$KC"
            rm "$RUNNER_TEMP/key.p8"
          elif [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials pakon-ci --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # signed but not notarized: Gatekeeper blocks it on download (1.0.0–1.0.2)
            echo "a release needs notarization: APPLE_API_KEY* or APPLE_ID secrets" >&2; exit 1
          else
            exit 0
          fi
          echo "PAKON_NOTARY_PROFILE=pakon-ci" >> "$GITHUB_ENV"

      - name: Build
        run: packaging/macos/build.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/macos/Pakon.dmg
            dist/macos/Pakon-Universal.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
            pkg-config libclang-dev nsis python3-venv

      - name: Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal --target x86_64-pc-windows-gnu
          rustup default "$RUST"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> ../dist/windows/target

      - name: Build
        run: packaging/windows/build.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/windows/Pakon-Setup.exe
          if-no-files-found: error

  linux:
    needs: version
    # 22.04, as packaging/linux/Dockerfile: glibc 2.35 and newer
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config dpkg-dev file libclang-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Rust
        run: rustup toolchain install "$RUST" --profile minimal && rustup default "$RUST"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> ../dist/linux/target-amd64

      - name: Build
        run: packaging/linux/build-deb.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/linux/pakon_amd64.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          {
            echo "### What's new"
            echo "- "
            echo
            echo "Unofficial, independent software. Not affiliated with or endorsed by Kodak or Pakon."
            echo
            echo "SHA-256:"
            for f in Pakon.dmg Pakon-Universal.dmg Pakon-Setup.exe pakon_amd64.deb; do
              echo "- \`$f\`: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } > ../notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
              Pakon.dmg Pakon-Universal.dmg Pakon-Setup.exe pakon_amd64.deb
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Pakon $VERSION" --notes-file ../notes.md \
              Pakon.dmg Pakon-Universal.dmg Pakon-Setup.exe pakon_amd64.deb
          fi
