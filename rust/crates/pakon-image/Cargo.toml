[package]
name = "pakon-image"
version = "0.1.0"
description = "Pakon image pipeline: raw decode, ribbon, OEM colour, framing, dust removal, export."
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ab_glyph = "0.2"

[dev-dependencies]
ndarray-npy = "0.9"
